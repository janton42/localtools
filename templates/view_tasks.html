{% extends 'base.html' %}

{% block content %}
  {% if user_tasks %}
    <ul>
      {% for task in user_tasks %}
      <li>Task: {{ task.title }} | {{ task.due }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>You have no tasks</p>
  {% endif %}
  <a href="{% url 'tasktron:create_task' %}">Create a task</a>
{% endblock %}
