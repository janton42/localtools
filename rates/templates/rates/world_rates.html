{% extends 'base.html' %}

{% block content %}
    <h2>Rate Recommendation</h2>
    <form action="" method="POST">
        {% csrf_token %}
        {% for field in form %}
            <p>
                {{ field.label }}:
                <br>
                {{ field }}
            </p>
        {% endfor %}
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
{% endblock %}
