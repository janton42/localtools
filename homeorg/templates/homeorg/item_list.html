{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <div class="mb-3">
      <a href="{% url 'homeorg:index' %}" class="btn btn-outline-secondary">Back to Rooms</a>
    </div>
    <h2>Items</h2>
    <div class="mb-3">
      <a href="{% url 'homeorg:item-create' %}" class="btn btn-primary">Add Item</a>
    </div>
    {% if object_list %}
      <ul class="list-group mb-3">
        {% for item in object_list %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <a href="{% url 'homeorg:item-detail' item.pk %}">{{ item.name }}</a>
              <span class="text-muted">{{ item.description }}</span>
            </div>
            <div>
              <a href="{% url 'homeorg:item-update' item.pk %}" class="btn btn-secondary btn-sm">Edit</a>
              <form method="post" action="{% url 'homeorg:item-delete' item.pk %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this item?');">Delete</button>
              </form>
            </div>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No items found.</p>
    {% endif %}
  </div>
{% endblock %}
