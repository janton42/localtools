{% extends 'base.html' %}

{% block content %}

    {% if user.is_authenticated %}
        <div class="container">
            <h2>Upload A Resume<h2>
            <form action="" method="POST">
                {% csrf_token %}
                {% for field in form %}
                <p>
                {{ field.label }}:
                <br>
                {{ field }}
                </p>
            {% endfor %}
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            </form>
        </div>
    {% else %}
        <h1>Log in to get rate estimates.</h1>
    {% endif %}
{% endblock %}
