{% extends 'base.html' %}

{% block content %}
  {% if user_tasks %}
  <table>
    {% for task in user_tasks %}
    <tr>
      <td>{{ task.title }}</td>
      <td>{{ task.due }}</td>
      <td>{{ task.status }}</td>
      <td><a href="{% url 'tasktron:update_task' task.id %}">Edit</a></td>
      <td><a href="{% url 'tasktron:delete_task' task.id %}">Delete</a></td>
    </tr>
    {% endfor %}
  </table>


  {% else %}
    <p>You have no tasks</p>
  {% endif %}
  <a href="{% url 'tasktron:create_task' %}">Create a task</a>
{% endblock %}
