{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container">
    {% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
    <h1>Resume Parser</h1>
    {%  if resume %}
        <p>Resume: {{ resume }}</p>
    {%  endif %}
    </div>
{% endblock %}
