{% extends 'base.html' %}

{% block content %}
    <h2>Resume Upload</h2>
    <form class="post-form" action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <p>
                {{ field.label }}:
                <br>
                {{ field }}
            </p>
        {% endfor %}
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <a href="{% url 'resume_parser:index' %}">Cancel</a>
    </form>
{% endblock %}
