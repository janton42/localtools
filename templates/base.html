<!DOCTYPE html>
{% load static %}
{% get_static_prefix as STATIC_PREFIX %}
<html lang="en-US">
  <head>
  	<meta name="viewport" content="width=device-width, initial-scale=1">
  	<meta charset="utf-8">
  	<title>Site Title</title>
  	<script src="https://use.fontawesome.com/382d19b8cb.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ STATIC_PREFIX }}styles/style.css"/>
  </head>

  <body>
    <div id="page-container">
      <header class="page-header">
        <div class="topnav">
          <a href="{% url 'home' %}">Home</a>
          {% if user.is_authenticated %}

          <div class="dropdown">
            <a href="#">Toolbox</a>
            <div class="dropdown-content">
              <a href="{% url 'tasktron:view_tasks' %}">Tasktron</a>
            </div>
          </div>

          <div class="dropdown">
            <a href="#">Settings</a>
            <div class="dropdown-content">
              <a href="{% url 'logout' %}">Logout</a>
              <a href="{% url 'tasktron:profile_view' %}">View Profile</a>
            </div>
          </div>



          {% else %}
          <a href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
          <h1>Local Tools</a></h1>
      </header>
      <div id="content-wrap">
        <div class="row">
            <div class="col">
            {% block content %}
            {% endblock %}
          </div>
        </div>
        <div class="row">
            <div class="col">
            {% block next %}
            {% endblock %}
          </div>
        </div>
      </div>
      <footer id="footer">
          <p>This is the footer</p>
      </footer>
    </div>
  </body>

</html>
