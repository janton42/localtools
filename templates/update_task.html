{% extends 'base.html' %}

{% block content %}

<!-- # {#% url 'tasktron:update_task' task.id %} -->
<form class="post-form" action="" method="POST">
  {% csrf_token %}
  {% for field in form %}
  <div>
    <p>
      {{ field.label }}: <br> {{ field.value }}
    </p>

    {% for error in field.errors %}
      <small style="color: red">{{ error }}</small>
    {% endfor %}
  </div>
{% endfor %}
<button type="submit">Submit</button>
<button type="reset">Reset</button>
<a href="{% url 'tasktron:view_tasks' %}">Cancel</a>
</form>

{% endblock %}
